name: Daily Ingestion & Catalog Publication

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: "ingest-publish"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ingest-and-publish:
    name: Ingest, Publish Catalog & Deploy Dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Hardened Ingestion Pipeline
        run: |
          python main.py --no-telegram
        env:
          HEADLESS: "True"

      - name: Sync Public Catalog to Frontend
        run: |
          mkdir -p frontend/public/data
          cp data/hackathons.json frontend/public/data/hackathons.json
          cp data/hackathons.json frontend/public/hackathons.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Build Frontend Dashboard
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Commit Updated Catalog
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hackathons.json frontend/public/data/hackathons.json frontend/public/hackathons.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(catalog): automated daily catalog sync [skip ci]"
            git push origin main
          else
            echo "No catalog changes detected. Skipping git push."
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
