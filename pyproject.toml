[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-ingestion-platform"
version = "1.0.0"
description = "Hackathon Ingestion Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file
]

[tool.ruff.lint.isort]
known-first-party = ["api", "bot", "db", "fetcher", "filters", "logs", "models", "utils", "config", "exporter", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
